CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y

CONFIG_RET_CLIENT=y

# Settings keep the client's identity, and so its address, across reboots.
# Each board conf picks the backend (RET_CLIENT selects SETTINGS).

CONFIG_LOG=y
CONFIG_RET_LOG_LEVEL_INF=y
