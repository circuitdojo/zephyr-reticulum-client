CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y

# A transport node: the protocol core and the routing tables, no client.
CONFIG_RET_CORE=y
CONFIG_RET_TRANSPORT=y

# Paths and the node's identity live on LittleFS (/lfs): the paths as one
# file each, settings in a file next to them.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/gw-settings"
CONFIG_RET_GATEWAY_STORE_LFS=y

CONFIG_POLL=y
CONFIG_LOG=y
