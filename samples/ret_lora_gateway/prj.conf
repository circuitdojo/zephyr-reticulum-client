CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y

# A transport node: the protocol core and the routing tables, no client.
CONFIG_RET_CORE=y
CONFIG_RET_TRANSPORT=y

# Paths in ZMS, a record each, on a partition of their own
# (gw_paths_partition); settings (identity, boot counter) in ZMS on the
# board's settings partition. 32-bit IDs keep ZMS's data CRC.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_ZMS=y
CONFIG_ZMS_DATA_CRC=y
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_ZMS_LOOKUP_CACHE_MANUAL=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_RET_GATEWAY_STORE_ZMS=y

CONFIG_POLL=y
CONFIG_LOG=y
