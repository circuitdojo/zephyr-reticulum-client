# TF-M with the crypto the library needs (see samples/ret_basic's board conf).
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_NPM13XX_CHARGER=n
CONFIG_STS4X=n

# The external W25Q128 NOR, where the stores live.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_SPI_NOR_SFDP_RUNTIME=y

CONFIG_LOG_MODE_IMMEDIATE=y

# Warm reboot after the workload, to time the boot.
CONFIG_REBOOT=y
