CONFIG_MAIN_STACK_SIZE=8192
CONFIG_RET_CORE=y
CONFIG_RET_TRANSPORT=y

# As the gateway's ZMS build: paths in ZMS on their own partition,
# settings in ZMS on the settings partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_ZMS=y
CONFIG_ZMS_DATA_CRC=y
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_ZMS_LOOKUP_CACHE_MANUAL=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_RET_GATEWAY_STORE_ZMS=y

CONFIG_LOG=y
