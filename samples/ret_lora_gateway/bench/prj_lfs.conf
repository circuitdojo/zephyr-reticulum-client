CONFIG_MAIN_STACK_SIZE=8192
CONFIG_RET_CORE=y
CONFIG_RET_TRANSPORT=y

# As the gateway: paths on LittleFS, settings in a file next to them.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/gw-settings"
CONFIG_RET_GATEWAY_STORE_LFS=y

CONFIG_LOG=y
