# The Feather: LTE through the modem (offloaded sockets), as samples/ret_basic.
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n
# The modem runs TCP/IP: trim Zephyr's native stack (see ret_basic's board conf).
CONFIG_NET_TCP=n
CONFIG_NET_MAX_CONN=1
CONFIG_NET_MAX_CONTEXTS=1
CONFIG_NET_PKT_RX_COUNT=2
CONFIG_NET_PKT_TX_COUNT=2
CONFIG_NET_BUF_RX_COUNT=4
CONFIG_NET_BUF_TX_COUNT=4
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_NET_IF=y
CONFIG_NRF_MODEM_LIB_NET_IF_AUTO_START=y
CONFIG_NRF_MODEM_LIB_NET_IF_AUTO_CONNECT=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024
CONFIG_AT_MONITOR_HEAP_SIZE=1024

# TF-M with the crypto the library needs.
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
# TF-M logs on UART instance 1 by default, which makes the instance secure:
# SPIM1 (the SX1262's SPI, the same instance) then bus-faults the
# non-secure app at its first register write (pinctrl, at boot).
CONFIG_TFM_LOG_LEVEL_SILENCE=y

# The SX1262's IRQ work (SPI transfers, the RX callback copying a 256-byte
# frame, CRC-error and queue-full logs in immediate mode) runs on the
# system workqueue: 1152 bytes by default is tight.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_NPM13XX_CHARGER=n
CONFIG_STS4X=n

# The external W25Q128 NOR, holding settings and paths (ZMS).
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_SPI_NOR_SFDP_RUNTIME=y

# The SX1262, through Zephyr's native driver. It must not sleep between
# operations: a late RX-done would find it asleep.
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
# The LoRaMac-node driver defaults on for any SX1262 in the devicetree,
# whatever the backend; its module is not in the workspace.
CONFIG_LORA_SX126X=n
CONFIG_LORA_SX126X_NATIVE_SLEEP=n

CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=60
CONFIG_THREAD_NAME=y
CONFIG_LOG_MODE_IMMEDIATE=y
