# Host BSD sockets (NSOS): reaches rnsd on 127.0.0.1 with no TAP
# interface or root. Like the nRF91 modem, sockets are offloaded, so the
# client exercises the same socket path it will on hardware.
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# Embedded libc so eventfd is Zephyr's, not the host's (as in lion-client).
CONFIG_PICOLIBC=y

# PSA Crypto from Zephyr's mbedTLS (never NRF_SECURITY on native_sim).
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192

# Settings (prj.conf) live in the simulated flash, a file: select it with
# --flash=<path>.

CONFIG_RET_SERVER_HOST="127.0.0.1"
CONFIG_RET_SERVER_PORT=4242

# NSOS needs no Ethernet; keep the TAP driver from trying to create zeth.
CONFIG_ETH_NATIVE_TAP=n
