CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y

CONFIG_RET_CLIENT=y

# Settings keep the client's identity, and so its address, across reboots.
# NVS needs a storage partition on the board.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

CONFIG_LOG=y
CONFIG_RET_LOG_LEVEL_INF=y
