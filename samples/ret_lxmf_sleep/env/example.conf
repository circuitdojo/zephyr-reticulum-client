# Per-device settings for a hardware build. Copy to env/<name>.conf (other
# files in env/ are gitignored) and pass it with
#   west build ... -- -DEXTRA_CONF_FILE=env/<name>.conf
#
# The rnsd the board connects to over LTE (see tools/rnsd-hw).
CONFIG_RET_SERVER_HOST="rnsd.example.com"
CONFIG_RET_SERVER_PORT=4242
# The propagation node (lxmd) holding mail while the board sleeps.
CONFIG_RET_SLEEP_PROPAGATION_NODE="00112233445566778899aabbccddeeff"
#CONFIG_RET_SLEEP_CONTACT="00112233445566778899aabbccddeeff"
#CONFIG_RET_SLEEP_INTERVAL_S=600
