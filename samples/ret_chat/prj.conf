# main starts things: settings (LittleFS on the board), the identity and
# ratchet on first boot, the client.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y

CONFIG_RET_CLIENT=y

# Settings keep the client's identity (its address) and the contacts
# across reboots. Each board conf picks the backend.

# The shell on the console UART. Logs go through it too, so a message
# arriving while you type does not garble the line.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_PROMPT_UART="chat> "
# 'msg send' packs and signs on the shell thread (about 1.5 KB), and
# 'contact add' writes settings from it.
CONFIG_SHELL_STACK_SIZE=4096
# Room for a message of a few hundred bytes typed or pasted on one line.
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_HISTORY_BUFFER=256
CONFIG_SHELL_WILDCARD=n
CONFIG_KERNEL_SHELL=n
CONFIG_DEVICE_SHELL=n

CONFIG_LOG=y
CONFIG_RET_LOG_LEVEL_INF=y
