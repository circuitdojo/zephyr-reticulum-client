# nRF9151 Feather: TCP over the modem's offloaded sockets (like NSOS on
# native_sim, the client sees plain BSD sockets), PSA Crypto from TF-M.
CONFIG_NET_SOCKETS_OFFLOAD=y
# The modem runs TCP/IP and DNS (getaddrinfo goes to it), so Zephyr's own
# stack is left out: about 20 KB of RAM (packet buffers, TCP slab, RX/TX
# threads, DNS resolver) and 50 KB of flash. NET_IPV4/NET_IPV6 then only
# enable the address families.
CONFIG_NET_NATIVE=n
CONFIG_NET_IPV6=y

# Modem: bring LTE up at boot; the connection manager reports L4 up/down.
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_NET_IF=y
CONFIG_NRF_MODEM_LIB_NET_IF_AUTO_START=y
CONFIG_NRF_MODEM_LIB_NET_IF_AUTO_CONNECT=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024
CONFIG_AT_MONITOR_HEAP_SIZE=1024

# TF-M provides PSA Crypto to the non-secure app. NCS's minimal TF-M
# profile builds the secure image with random generation only and ignores
# PSA_WANT_* (SHA-256, HMAC and AES-CBC calls then fail with
# PSA_ERROR_NOT_SUPPORTED), so use the configurable profile.
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
# TF-M's 128 kB slot is in the flash layout:
# samples/common/circuitdojo_feather_nrf9151_ns_flash.dtsi.

# The board's startup code configures the nPM1300 PMIC through its MFD
# driver, so that stays; the charger and sensor drivers are not used.
CONFIG_NPM13XX_CHARGER=n
CONFIG_STS4X=n

# Settings in a file on LittleFS on the external W25Q128 NOR flash (the
# board's devicetree mounts it at /lfs), as in lion_sleep. Internal flash
# holds only firmware, so a re-layout or reflash cannot take the client's
# identity (its address) with it. At the mount root: the file backend
# creates the file but not parent directories.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
# Read the flash geometry from the chip's SFDP tables. nfed revisions
# before the jared/nor-flash-size fix declare the W25Q128 as 2 MiB (its
# devicetree `size` is in bits); with those, this is what makes the 16 MiB
# LittleFS work.
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/ret-settings"
# The file backend rewrites the whole file once it holds more lines than
# this. LXMF replay protection keeps ~70 keys (CONFIG_RET_LXMF_SEEN_ENTRIES
# plus identity, clock, floor): at the default 32 every received message
# would rewrite the file; at 512 it is about once per 450 messages.
CONFIG_SETTINGS_FILE_MAX_LINES=512

# Stack use on demand, from the shell: 'kernel thread stacks' (the shell
# thread's peak comes from 'msg send' and 'contact add').
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_NAME=y

# LXMF timestamps are wall-clock time: the date_time library sets
# SYS_CLOCK_REALTIME from the network's time (modem), and from NTP when
# the network sends none.
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_MODEM=y
CONFIG_DATE_TIME_NTP=y

# RAM: the client keeps a Resource stream buffer, a plaintext buffer and
# the DIRECT send pool, each RET_RESOURCE_MAX_SIZE (8 KB by default). At
# 4 KB this sample (shell, inbox) stays under 85% of the nRF9151's RAM;
# messages are then limited to about 3.9 KB each way, and a sync fetches
# batches of at most 3 KB (it must stay below the Resource size).
CONFIG_RET_RESOURCE_MAX_SIZE=4096
CONFIG_RET_LXMF_SYNC_LIMIT_KB=3
