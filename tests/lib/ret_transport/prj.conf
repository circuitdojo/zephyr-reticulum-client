CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384

CONFIG_RET_CORE=y
CONFIG_RET_TRANSPORT=y
# Small RAM path cache, so tests reach the store.
CONFIG_RET_TRANSPORT_PATHS=4
CONFIG_RET_TRANSPORT_ANNOUNCE_QUEUE=4
CONFIG_RET_TRANSPORT_HELD_ANNOUNCES=4

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192

CONFIG_LOG=y
