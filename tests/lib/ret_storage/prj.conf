CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=8192

# ret_storage is part of the client (its table sizes are client options).
# The client is built but never started; the networking is what it needs
# to build on native_sim, as in the samples.
CONFIG_RET_CLIENT=y
CONFIG_RET_RATCHET_COUNT=8
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_PICOLIBC=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192

# Settings in NVS on the simulated flash, as the samples keep them.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

CONFIG_LOG=y
