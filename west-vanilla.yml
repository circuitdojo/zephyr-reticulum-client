manifest:
  projects:
    - name: zephyr
      # v4.5.0: one release past the line NCS v3.5 is built on (v4.4.0 plus
      # later upstream, including backports such as ZMS's iterator, which
      # the LoRa gateway's path store needs and v4.4.x lacks). Code must
      # build in both.
      revision: v4.5.0
      url: https://github.com/zephyrproject-rtos/zephyr
      west-commands: scripts/west-commands.yml
      # native_sim-only workspace: Mbed TLS and TF-PSA-Crypto (since 4.4
      # the PSA Crypto API lives in the latter) and picolibc for the
      # embedded libc the samples select.
      import:
        name-allowlist:
          - mbedtls
          - tf-psa-crypto
          - picolibc
    - name: monocypher
      # X25519 and RFC 8032 Ed25519. Not a Zephyr module: ret-client's
      # port/zephyr/CMakeLists.txt compiles it from this path.
      url: https://github.com/LoupVaillant/Monocypher
      revision: 4.0.2
      path: modules/crypto/monocypher
    - name: mpack
      # msgpack for Link requests/responses, Resource advertisements and
      # LXMF. Its encoder picks the same smallest forms as RNS's umsgpack,
      # which LXMF signatures depend on (tests/lib/ret_msgpack checks it).
      url: https://github.com/ludocode/mpack
      revision: v1.1.1
      path: modules/lib/mpack

  self:
    path: ret-client
