# Runs on the self-hosted Forgejo runner. Setup, the named volumes this file
# expects, and the reasons behind the odd-looking steps: docs/ci-forgejo.md.
name: CI

enable-email-notifications: true

on:
  push:
    branches: [main]
  pull_request:

# One west workspace on one volume, shared by every run: queue, never run
# two at once. Not cancelled: a run dropped while queued reports no status.
concurrency:
  group: ret-client-west
  cancel-in-progress: false

jobs:
  native_sim:
    name: native_sim (unit tests, build, rnsd e2e)
    runs-on: docker
    container:
      image: ret-client-ci:latest
      options: >-
        --volume ret-client-west:/west-workspace
        --volume ret-client-ccache:/ccache

    steps:
      - uses: actions/checkout@v4
        with:
          path: ret-client
          persist-credentials: false

      - name: Copy the checkout into the cached west workspace
        # Copied, not symlinked: `west init -l` resolves the manifest repo to
        # pick the topdir, and a symlink would put it back under
        # GITHUB_WORKSPACE, off the volume.
        run: |
          rm -rf /west-workspace/ret-client
          cp -a "$GITHUB_WORKSPACE/ret-client" /west-workspace/ret-client

      - name: west init/update (vanilla Zephyr)
        working-directory: /west-workspace
        run: |
          [ -d .west ] || west init -l --mf west-vanilla.yml ret-client
          west update --narrow -o=--depth=1

      - name: Python tooling (lint, golden vectors match pinned RNS)
        working-directory: /west-workspace/ret-client/tools/rns_peer
        # Regenerating the vectors and diffing proves the checked-in header
        # still comes from the RNS version uv.lock pins.
        run: |
          uv sync --locked --group dev
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked gen_vectors.py ../../tests/common/vectors_rns.h
          git -C ../.. diff --exit-code -- tests/common/vectors_rns.h
          # scripts/flash.py: tests ported from Zephyr Tools' own suites.
          uv run --with pytest pytest -q ../../scripts
          uv run --locked ruff check ../../scripts
          uv run --locked ruff format --check ../../scripts

      - name: Unit tests
        working-directory: /west-workspace
        # -c overwrites twister-out instead of keeping one per run forever.
        run: ret-client/scripts/twister.sh -c -T ret-client/tests -p native_sim -v --inline-logs -O build/twister-ret

      - name: Build the samples (no warnings)
        working-directory: /west-workspace
        # run: steps are bash -e without pipefail; without it tee hides a
        # failed build.
        run: |
          set -o pipefail
          for s in ret_basic ret_lxmf; do
            west build -b native_sim ret-client/samples/$s -d build/$s -p --no-sysbuild 2>&1 | tee build/$s.log
            ! grep -q "warning:" build/$s.log
          done

      - name: End to end against rnsd
        id: e2e
        working-directory: /west-workspace
        run: ret-client/tools/run_e2e.sh

      - name: e2e logs on failure
        # Only for this step: the logs directory lives on the shared volume
        # and would otherwise show an earlier run's logs.
        if: failure() && steps.e2e.outcome == 'failure'
        working-directory: /west-workspace
        run: |
          for f in build/ret_e2e-logs/*.log; do
            echo "::group::$f"; sed 's/\x1b\[[0-9;]*m//g' "$f"; echo "::endgroup::"
          done

  nrf9151:
    name: nRF9151 (NCS build)
    # Builds the samples for the nRF9151 Feather in the NCS workspace: the only
    # build that proves the board config, TF-M profile check and modem path
    # compile and link. Gated on native_sim so a run that fails the tests
    # does not spend the NCS build.
    needs: [native_sim]
    runs-on: docker
    container:
      image: ret-client-ci:latest
      # Its own workspace: west-ncs.yml (sdk-nrf, nfed, Monocypher) is a
      # different tree from the vanilla one. The first run on a cold volume
      # clones all of NCS (the better part of an hour); later runs fetch.
      # ccache is shared on purpose: safe under concurrent use.
      options: >-
        --volume ret-client-ncs-west:/ncs-workspace
        --volume ret-client-ccache:/ccache

    steps:
      - uses: actions/checkout@v4
        with:
          path: ret-client
          persist-credentials: false

      - name: Copy the checkout into the cached NCS workspace
        run: |
          rm -rf /ncs-workspace/ret-client
          cp -a "$GITHUB_WORKSPACE/ret-client" /ncs-workspace/ret-client

      - name: west init/update (NCS)
        working-directory: /ncs-workspace
        run: |
          [ -d .west ] || west init -l --mf west-ncs.yml ret-client
          west update --narrow -o=--depth=1

      - name: Build the samples (nRF9151, sysbuild, no compiler warnings)
        working-directory: /ncs-workspace
        # -p: the build directory is on the volume and outlives the run, and
        # a stale CMake cache is the failure that reproduces nowhere else.
        # No env/ overlay: per-device settings are gitignored, so CI builds
        # the sample as checked in. Kconfig's TFM_EXPERIMENTAL notice is not
        # a compiler warning and does not match.
        # build/ must exist before tee opens its log (cold volume).
        run: |
          set -o pipefail
          mkdir -p build
          for s in ret_basic ret_lxmf; do
            west build -b circuitdojo_feather_nrf9151/nrf9151/ns ret-client/samples/$s \
              -d build/${s}_nrf9151 -p 2>&1 | tee build/${s}_nrf9151.log
            ! grep -q ": warning:" build/${s}_nrf9151.log
          done

      - name: Collect the images
        # merged.hex is TF-M plus the application: what scripts/flash.py
        # programs. Copied under GITHUB_WORKSPACE, the only place
        # upload-artifact collects from.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for s in ret_basic ret_lxmf; do
            cp /ncs-workspace/build/${s}_nrf9151/merged.hex \
              "$GITHUB_WORKSPACE/dist/$s-circuitdojo_feather_nrf9151_ns.hex"
          done

      - name: Upload images
        uses: forgejo/upload-artifact@v4
        with:
          name: samples-nrf9151
          path: dist
          if-no-files-found: error
          retention-days: 14

